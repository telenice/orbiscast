name: CI

on:
    # Pushes to master run this through the Release workflow, so it isn't
    # triggered twice.
    pull_request:
    workflow_call:
    workflow_dispatch:

jobs:
    typecheck_and_test:
        name: Typecheck & test
        runs-on: ubuntu-latest
        steps:
            - name: Check out the repo
              uses: actions/checkout@v7

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Typecheck
              run: npm run typecheck

            - name: Run tests
              run: npm run test
